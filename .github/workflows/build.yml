name: VibeOS Build ISO

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    name: Build VibeOS ISO
    outputs:
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - name: Get build date
        id: date
        run: |
          echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        id: clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add CachyOS Keyring & Repos
        id: keyring
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf

      - name: Install Build Dependencies
        id: dependencies
        run: |
          pacman -Syu --noconfirm archiso cachyos-keyring mkinitcpio-archiso squashfs-tools grub git

      - name: Create Build User
        id: user-archiso
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Build VibeOS ISO
        id: build
        run: |
          sudo -H -E -u builder ./buildiso.sh

      - name: Upload ISO to Artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: vibeos-desktop-linux-${{ steps.date.outputs.builddate }}
          path: out/desktop/*
          retention-days: 14

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          cp out/desktop/*.sha256 release_files/ 2>/dev/null || true
          cp out/desktop/*.sha1 release_files/ 2>/dev/null || true
          cp out/desktop/*.pkgs.txt release_files/ 2>/dev/null || true
          # Split ISO into <2GB chunks for GitHub Release asset limits
          split -b 1800M out/desktop/*.iso release_files/vibeos-desktop-linux-${{ steps.date.outputs.builddate }}.iso.part_
          ls -lh release_files/

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.builddate }}
          name: VibeOS Linux Release ${{ steps.date.outputs.builddate }}
          draft: false
          prerelease: false
          files: release_files/*
          body: |
            ## ⚡ VibeOS Linux Release ${{ steps.date.outputs.builddate }}
            
            **Muallif / Creator:** [backandchi](https://github.com/backandchi)
            
            ### 📥 Yuklab olish (Download):
            - **To'liq ISO:** [GitHub Actions Artifacts](https://github.com/backandchi/vibe-os/actions/runs/${{ github.run_id }}) bo'limidan bitta fayl qilib yuklab olishingiz mumkin.
            - **Bo'lingan qismlar:** Pastdagi `part_aa` va `part_ab` fayllarini yuklab olib, birlashtiring:
              - **Windows (CMD):** `copy /b vibeos*.part_aa + vibeos*.part_ab vibeos.iso`
              - **Linux / Mac:** `cat vibeos*.part_* > vibeos.iso`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
