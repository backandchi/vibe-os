# ==========================================================
#          VibeOS Hyprland Configuration
# ==========================================================

monitor=,preferred,auto,auto

# Autostart essential services
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(00f5d4ee) rgba(7b2cbfee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    drop_shadow = true
    shadow_range = 15
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mainMod = SUPER

# ==========================================================
# 🪟 Windows-Style Shortcuts
# ==========================================================
bind = $mainMod, E, exec, thunar || dolphin
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = CONTROL SHIFT, Escape, exec, kitty -e btop
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, D, exec, hyprctl dispatch workspace empty
bind = $mainMod, L, exec, swaylock

# ==========================================================
# ⚡ Vibe Coding Shortcuts
# ==========================================================
bind = $mainMod, SPACE, exec, [float; size 70% 70%; center] kitty -e vibe-ai-chat
bind = $mainMod, slash, exec, [float; size 75% 75%; center] kitty -e vibe-wiki
bind = $mainMod, F1, exec, [float; size 75% 75%; center] kitty -e vibe-wiki
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, C, exec, code || cursor || nvim
bind = $mainMod, B, exec, cachy-browser || firefox || chromium
bind = $mainMod, G, exec, [float; size 80% 80%; center] kitty -e lazygit
bind = $mainMod, M, exec, [float; size 80% 80%; center] kitty -e lazydocker
bind = $mainMod, Q, killactive,

# Window navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
