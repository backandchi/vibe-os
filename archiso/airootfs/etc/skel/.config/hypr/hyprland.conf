# ==========================================================
#          VibeOS Hyprland Master Configuration
#          Muallif: backandchi
# ==========================================================

monitor=,preferred,auto,auto

# Fon rasmi va asosiy xizmatlarni yuklash
exec-once = swww init || swww img /usr/share/backgrounds/vibeos/vibe-wallpaper.svg
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = vibe-ghost-git --snapshot

input {
    kb_layout = us,uz
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad { natural_scroll = true }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(00f5d4ee) rgba(7b2cbfee) 45deg
    col.inactive_border = rgba(1a1a24aa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
    drop_shadow = true
    shadow_range = 20
    col.shadow = rgba(00000088)
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, overshot
}

$mainMod = SUPER

# ==========================================================
# 🎛️ Vibe Control Center & Super-Features Hotkeys
# ==========================================================
bind = $mainMod, I, exec, kitty --title "Vibe Control Center" -e vibe-control
bind = $mainMod, SPACE, exec, [float; size 70% 70%; center] kitty -e vibe-ai-chat
bind = $mainMod, Z, exec, [float; size 65% 65%; center] kitty --title "Vibe Ghost Git" -e vibe-ghost-git
bind = $mainMod, X, exec, vibe-lens
bind = $mainMod, F11, exec, vibe-flow
bind = ALT, RETURN, exec, [float; size 70% 70%; center] kitty -e vibe-autohealer
bind = $mainMod, slash, exec, [float; size 75% 75%; center] kitty -e vibe-wiki

# ==========================================================
# 🪟 Windows-Style Shortcuts
# ==========================================================
bind = $mainMod, E, exec, thunar || dolphin
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Xotira" | cliphist decode | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = CONTROL SHIFT, Escape, exec, kitty -e btop
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, D, exec, hyprctl dispatch workspace empty
bind = $mainMod, L, exec, swaylock

# ==========================================================
# ⚡ Dasturchi Qisqartmalari
# ==========================================================
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, C, exec, code || cursor || nvim
bind = $mainMod, B, exec, cachy-browser || firefox || chromium
bind = $mainMod, G, exec, [float; size 80% 80%; center] kitty -e lazygit
bind = $mainMod, M, exec, [float; size 80% 80%; center] kitty -e lazydocker
bind = $mainMod, Q, killactive,

# Navigatsiya
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
