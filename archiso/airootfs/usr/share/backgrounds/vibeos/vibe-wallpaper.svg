<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="60%" stop-color="#05070a" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#01be9b" />
    </linearGradient>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="3840" height="2160" fill="url(#bg)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#00f5d4" stroke-width="1" opacity="0.08">
    <path d="M 0,1080 L 3840,1080 M 1920,0 L 1920,2160" />
    <circle cx="1920" cy="1080" r="400" fill="none" stroke="#7b2cbf" stroke-width="2" opacity="0.15" />
    <circle cx="1920" cy="1080" r="700" fill="none" stroke="#00f5d4" stroke-width="1" opacity="0.1" />
  </g>

  <!-- Glowing Central Emblem -->
  <g transform="translate(1920, 950)" filter="url(#glow)">
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="none" stroke="url(#neonCyan)" stroke-width="8" opacity="0.9" />
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70" fill="none" stroke="url(#cyberPurple)" stroke-width="4" opacity="0.7" />
    
    <!-- Stylized 'V' Bolt -->
    <path d="M -60,-80 L 0,80 L 60,-80 L 25,-80 L 0,20 L -25,-80 Z" fill="url(#neonCyan)" />
  </g>

  <!-- Main Title -->
  <text x="1920" y="1280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#ffffff" letter-spacing="18" text-anchor="middle" filter="url(#glow)">VIBEOS</text>
  
  <!-- Subtitle -->
  <text x="1920" y="1360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="32" fill="#00f5d4" letter-spacing="8" text-anchor="middle" opacity="0.9">HIGH-PERFORMANCE AI-NATIVE &amp; VIBE CODING LINUX</text>

  <!-- Author Badge -->
  <g transform="translate(1920, 1440)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#101726" stroke="#7b2cbf" stroke-width="2" opacity="0.8" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" fill="#e0aaff" letter-spacing="3" text-anchor="middle">👑 MUALLIF / CREATOR: BACKANDCHI</text>
  </g>
</svg>
