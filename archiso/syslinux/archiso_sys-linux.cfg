LABEL vibeos
TEXT HELP
VibeOS Linux (BORE Yadro & KDE Plasma)
Muallif: backandchi | O'zbekiston
ENDTEXT
MENU LABEL 🚀 VibeOS (BORE Yadro & KDE Plasma)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=pcspkr nvme_load=yes

# Fallback (Xavfsiz grafika)
LABEL vibeosfb
TEXT HELP
VibeOS Xavfsiz Grafika Rejimi (nomodeset - barcha kompyuterlar va virtual mashinalar uchun)
ENDTEXT
MENU LABEL 🛡️ VibeOS Xavfsiz Grafika (nomodeset, Universal)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes
